<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Schéma de deux sujets dans une zone de profondeur de champ, style EXPO">
<defs>
  <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
   <stop stop-color="#fbfaf6"/><stop offset="1" stop-color="#eee9df"/>
  </linearGradient>
  <linearGradient id="focus" x1="0" x2="1" y1="0" y2="0">
   <stop stop-color="#7fa6ac" stop-opacity="0.08"/><stop offset=".5" stop-color="#a9c6c8" stop-opacity=".4"/><stop offset="1" stop-color="#7fa6ac" stop-opacity=".10"/>
  </linearGradient>
  <linearGradient id="camera" x1="0" x2="1" y1="0" y2="1">
   <stop stop-color="#6a6b68"/><stop offset=".58" stop-color="#353c3d"/><stop offset="1" stop-color="#202729"/>
  </linearGradient>
  <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
   <path d="M3 9l1-.3M18 21l.8-.4M12 3l.9.2" stroke="#908c81" stroke-width=".85" opacity=".16"/>
  </pattern>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
   <path d="M40 0H0V40" stroke="#a3a9a5" stroke-width=".55" opacity=".25" fill="none"/>
  </pattern>
</defs>
<rect width="640" height="240" fill="url(#paper)"/>
<rect width="640" height="240" fill="url(#grain)"/>
<rect width="640" height="240" fill="url(#grid)"/>
<!-- Zone de netteté lisible, non proportionnelle. -->
<rect x="303" y="42" width="288" height="150" rx="7" fill="url(#focus)"/>
<path d="M304 45v148M590 45v148" stroke="#7399a0" stroke-width="2.4" stroke-dasharray="6 7"/>
<path d="M304 193H590" stroke="#b79a5e" stroke-width="4" stroke-linecap="round"/>
<!-- Champ / lignes de visée -->
<path d="M258 116L610 62M258 116L610 179" stroke="#637f82" stroke-width="1.65" fill="none" stroke-dasharray="7 8" opacity=".72"/>
<path d="M264 116H614" stroke="#ae965f" stroke-width="1.5" stroke-dasharray="3 7" opacity=".64"/>
<!-- Une caméra cinéma de profil, iconographie technique EXPO -->
<g stroke-linecap="round" stroke-linejoin="round">
 <rect x="95" y="65" width="151" height="111" rx="12" fill="url(#camera)" stroke="#263235" stroke-width="3"/>
 <path d="M110 65V51h66l12 14" fill="#343b3d" stroke="#263235" stroke-width="2.6"/>
 <rect x="112" y="87" width="64" height="49" rx="5" fill="#1a2427" stroke="#75807f" stroke-width="1.7"/>
 <rect x="119" y="94" width="49" height="31" rx="2" fill="#829498" opacity=".54"/>
 <path d="M126 102h34m-34 8h23m-23 8h14" stroke="#d0d5cb" stroke-width="1.25" opacity=".75"/>
 <circle cx="193" cy="103" r="5" fill="#afb8ae" stroke="#212a2b" stroke-width="2"/>
 <circle cx="216" cy="103" r="5" fill="#afb8ae" stroke="#212a2b" stroke-width="2"/>
 <circle cx="193" cy="128" r="5" fill="#afb8ae" stroke="#212a2b" stroke-width="2"/>
 <circle cx="216" cy="128" r="5" fill="#afb8ae" stroke="#212a2b" stroke-width="2"/>
 <path d="M104 155h134M108 171h140" stroke="#969d96" stroke-width="2" opacity=".72"/>
 <path d="M246 83h16l13 14v38l-13 14h-16" fill="#303a3c" stroke="#263235" stroke-width="2.6"/>
 <rect x="267" y="94" width="32" height="44" rx="5" fill="#3e4545" stroke="#222b2c" stroke-width="3"/>
 <path d="M272 99h20m-20 10h20m-20 10h20m-20 10h20" stroke="#89928a" opacity=".72" stroke-width="1.5"/>
 <path d="M294 89l17-8v69l-17-8Z" fill="#283032" stroke="#202b2d" stroke-width="3"/>
 <rect x="111" y="174" width="134" height="8" rx="4" fill="#556065"/>
 <path d="M150 182v26m58-26v26m-67 0h77" stroke="#4a5151" stroke-width="5"/>
 <rect x="80" y="111" width="15" height="30" rx="3" fill="#373f40" stroke="#222b2d" stroke-width="2"/>
</g>
<!-- Deux personnages lisibles de face en aplats vectoriels, silhouettes côte à côte dans l'axe. -->
<g stroke-linecap="round" stroke-linejoin="round" stroke="#303d3e" stroke-width="2.4">
 <circle cx="390" cy="97" r="24" fill="#e6c9a5"/>
 <path d="M375 95q-8-23 15-24 22 0 24 22-13-10-21-9-10 6-18 11" fill="#555957" stroke="#424b4a" stroke-width="2"/>
 <path d="M362 151q4-27 28-27 25 0 29 27l7 30h-72Z" fill="#596f73"/>
 <path d="M390 129v34" stroke="#87999a" stroke-width="1.5" opacity=".55"/>
</g>
<g stroke-linecap="round" stroke-linejoin="round" stroke="#303d3e" stroke-width="2.4">
 <circle cx="518" cy="99" r="23" fill="#e6cdb3"/>
 <path d="M495 99q-2-27 24-27 28 0 23 34l-5 12-5-14q4-11-6-18-14-4-31 13" fill="#514944" stroke="#4b4541" stroke-width="2"/>
 <path d="M488 152q3-27 29-27 27 0 32 27l6 29h-73Z" fill="#7d7471"/>
 <path d="M518 129v34" stroke="#b2a69b" stroke-width="1.5" opacity=".54"/>
</g>
<!-- Cercle de repérage technique : graphique, non décoratif -->
<g stroke="#bda469" stroke-width="1.6" fill="none" opacity=".95">
 <path d="M390 62V44m-8 9h16M518 65V45m-8 10h16"/>
 <circle cx="390" cy="62" r="3" fill="#bda469" stroke="none"/>
 <circle cx="518" cy="65" r="3" fill="#bda469" stroke="none"/>
</g>
<g fill="#434f50" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="1.5" text-anchor="middle">
 <text x="389" y="224">S1</text><text x="519" y="224">S2</text>
</g>
<path d="M308 208H588" stroke="#bda469" stroke-width="1.4"/>
</svg>